name: CI

# Branch model:
#   wi-*      feature branches  ->  PR into `develop`
#   develop   integration       ->  PR into `main`
#   main      production        ->  Render auto-deploys on push
#
# Goal of this workflow: every push and every PR into `develop` or `main`
# must have green backend + frontend tests. The Dockerfile is built only for
# changes heading to `main`, so a broken image never reaches the auto-deploy.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Cancel superseded runs on the same PR; leave branch pushes alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.lock pulls symfony/* 8.1 (needs PHP >= 8.4.1), so 8.3 can't
        # install it. 8.4 is the version in the production image; add '8.5' here
        # for forward coverage if wanted.
        php: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, gd, pdo, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Tests run on sqlite :memory: (phpunit.xml) with RefreshDatabase, so no
      # database service is needed. Scoped to Feature because phpunit.xml
      # declares an (empty) Unit suite that PHPUnit 12 rejects.
      - name: Execute tests
        run: php artisan test --testsuite=Feature

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20' # matches node:20-slim in the Dockerfile
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Production asset build
        run: npm run build

  docker:
    name: Build production image
    runs-on: ubuntu-latest
    # Only for changes heading to production, where Render auto-deploys this
    # same Dockerfile. Remove this job entirely if you don't want the check.
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (production target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          push: false
          load: false
          tags: loyalty-retention:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
